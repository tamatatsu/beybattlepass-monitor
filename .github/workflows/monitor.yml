name: ベイバトルパス在庫監視

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beybattlepass-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save monitor state if changed
        shell: bash
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name "bey-stock-bot"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update stock monitor state"
              git pull --rebase origin main
              git push origin main
            else
              echo "No state change"
            fi
          fi
